<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF-TRACK • Admin</title>

<style>
/* ================= RESET ================= */
*{box-sizing:border-box;margin:0;padding:0}

/* ================= THEME ================= */
:root{
  --blue:#2563eb;
  --blue-dark:#1e40af;
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --muted:#64748b;
  --green:#16a34a;
  --red:#dc2626;
}

/* ================= BODY ================= */
body{
  font-family:system-ui,-apple-system,Segoe UI;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  justify-content:center;
}

/* ================= PAGE ================= */
.page{
  width:100%;
  max-width:420px;
}

/* ================= HEADER ================= */
.header{
  height:160px;
  background:linear-gradient(135deg,#3b82f6,#1e40af);
  border-bottom-left-radius:40px;
  border-bottom-right-radius:40px;
}
.logo-wrap{
  margin-top:-70px;
  display:flex;
  justify-content:center;
}
.logo{
  width:120px;
  height:120px;
  border-radius:50%;
  background:#fff;
  border:5px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo img{width:70%}

/* ================= CARD ================= */
.card{
  background:var(--card);
  margin:16px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* ================= TEXT ================= */
h2{font-size:20px;margin-bottom:6px}
p{font-size:14px;color:var(--muted)}
small{color:var(--muted)}

/* ================= INPUT ================= */
.input-group{
  display:flex;
  margin-top:14px;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
input{
  flex:1;
  padding:12px;
  border:none;
  font-size:15px;
  outline:none;
}
button{
  padding:12px 16px;
  border:none;
  background:#d1d5db;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}
button.active{background:var(--blue)}

/* ================= LOADER ================= */
.loader{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  font-size:14px;
  color:var(--blue);
}
.spinner{
  width:18px;
  height:18px;
  border:3px solid #bfdbfe;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= USERS ================= */
.user{
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  font-size:14px;
}
.status{
  display:inline-block;
  padding:2px 8px;
  border-radius:10px;
  font-size:12px;
  margin-left:6px;
}
.active{background:#dcfce7;color:var(--green)}
.inactive{background:#fee2e2;color:var(--red)}
.linked{background:#dbeafe;color:var(--blue-dark)}

.user a{
  display:inline-block;
  margin-top:8px;
  color:var(--blue);
  text-decoration:none;
}

/* ================= MAP ================= */
.map{
  width:100%;
  height:220px;
  border-radius:14px;
  overflow:hidden;
  margin-top:10px;
}
.map iframe{
  width:100%;
  height:100%;
  border:0;
}

/* ================= DESKTOP ================= */
@media(min-width:768px){
  body{align-items:center}
}
</style>
</head>

<body>

<div class="page">

  <div class="header"></div>

  <div class="logo-wrap">
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Wolf_Icon.svg/512px-Wolf_Icon.svg.png">
    </div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h2>WOLF-TRACK</h2>
    <p>Admin authentication required</p>

    <div class="input-group">
      <input id="pass" placeholder="Enter your key">
      <button id="loginBtn">Enter</button>
    </div>
    <div id="loginStatus"></div>
  </div>

  <!-- ADMIN -->
  <div class="card" id="adminCard" style="display:none">
    <button class="active" onclick="generate()">Generate Tracking Link</button>
    <input id="link" readonly style="display:none;margin-top:10px">

    <h3 style="margin:18px 0 10px">Live Users</h3>
    <div id="users">No data…</div>
  </div>

</div>

<script>
/* ================= CONFIG ================= */
const API = "https://odd-wildflower-ef2f.ishaqanwar751.workers.dev";
let ADMIN_PASS = "";
function login(){
  ADMIN_PASS = document.getElementById("pass").value.trim();
  const status = document.getElementById("loginStatus");

  status.innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      Checking access…
    </div>
  `;

  fetch(API + "/get-all-locations", {
    headers: {
      "x-admin-password": ADMIN_PASS
    }
  })
  .then(r=>{
    if(r.status === 401){
      throw "unauthorized";
    }
    return r.json();
  })
  .then(()=>{
    // ✅ UNLOCK ADMIN
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("adminCard").style.display = "block";
    status.innerHTML = "";
  })
  .catch(()=>{
    status.innerHTML = "<p style='color:red'>Invalid password</p>";
  });
}

/* ================= GENERATE LINK ================= */
function generate(){
 fetch(API+"/create-link",{method:"POST"})
 .then(r=>r.json())
 .then(d=>{
   link.style.display="block";
   link.value=d.link;
 });
}

/* ================= LOAD USERS ================= */
async function loadUsers(){
 const r = await fetch(API+"/get-all-locations");
 const data = await r.json();
 users.innerHTML="";

 const now = Date.now();

 for(const token in data){
  const u = data[token];

  if(!seen[token]) seen[token] = u.time || now;

  const isActive = (now - (u.time||0)) < ACTIVE_WINDOW;
  const clicked = true; // link hit if record exists
const opened = u.opened === true;

  users.innerHTML += `
   <div class="user">
     <b>${token}</b>
     <span class="status ${opened ? 'linked' : 'inactive'}">
  ${opened ? 'Link opened' : 'Not opened'}
</span>

     </span>
     <span class="status linked">Link clicked</span>

     <div style="margin-top:6px">
       <small>Accuracy:</small> ${Math.round(u.acc||0)} m
     </div>

     <div class="map">
       <iframe
         src="https://www.google.com/maps?q=${u.lat},${u.lng}&z=18&output=embed">
       </iframe>
     </div>

     <a target="_blank"
       href="https://www.google.com/maps?q=${u.lat},${u.lng}">
       Open in Google Maps
     </a>
   </div>`;
 }
}

setInterval(loadUsers, 2000);
</script>

</body>
</html>
